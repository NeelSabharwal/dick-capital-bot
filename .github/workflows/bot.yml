name: Dick Capital Bot

# WHEN this bot runs:
#
# NOTE: scheduled polling was REMOVED — Substack/Cloudflare returns 403 to
# GitHub's datacenter IPs, so polling Substack from here can never work.
# The bot is now driven by the Gmail "doorbell" (email contains the pick).
on:
  # The instant "doorbell": the Gmail watcher fires this the moment a new
  # Dick Capital email arrives, passing the email contents in the payload.
  repository_dispatch:
    types: [new-substack-email]

  # A manual "Run" button in the GitHub Actions tab, for testing.
  workflow_dispatch: {}

# Let the workflow save the updated "seen" files back into the repo.
permissions:
  contents: write

# Never let two runs overlap (a scheduled run + an email-triggered run could
# collide on the state files). Runs queue and go one at a time.
concurrency:
  group: dick-capital-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot (email mode)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          SUBSTACK_PUBLICATION_HOST: dickcapital.substack.com
          # Email contents handed in by the Gmail watcher via repository_dispatch:
          EMAIL_BODY: ${{ github.event.client_payload.body }}
          EMAIL_CHAT_URL: ${{ github.event.client_payload.chat_url }}
          EMAIL_DATE: ${{ github.event.client_payload.date }}
        run: python bot.py --from-email

      - name: Remember which picks were already posted
        run: |
          git config user.name "dick-capital-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json chat_state.json
          if git diff --cached --quiet; then
            echo "No new state to save."
          else
            git commit -m "Update seen-state [skip ci]"
            git push
          fi
